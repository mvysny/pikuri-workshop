name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The doc layer on its own, so a drifted doc fails in seconds rather than
  # behind the whole spec suite; it needs only bash and git.
  design-tripwires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: design/verify_design_tripwires.sh

  # `rake check` = specs, then the seam tripwires, then the doc layer again:
  # the same command a contributor runs locally. The runner is not root, so
  # the specs that assert EACCES really exercise the deny path. pikuri's gems
  # come from rubygems, at the release Gemfile.lock names.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v5
      # ripgrep backs the Grep tool some specs drive; libvoikko + voikko-fi
      # let pikuri-stemmers' specs check the real Finnish dictionary.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep libvoikko1 voikko-fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake check
